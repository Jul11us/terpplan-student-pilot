name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a data snapshot that has gone stale (tests/data-freshness.test.mjs) is noticed
  # even in a week with no commits.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Tests
        run: npm test
